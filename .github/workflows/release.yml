name: Build & publish image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g. 26.04-20261016); otherwise derived from tag, falling back to VERSION'
        required: false
      publish:
        description: 'If false, skip upload + CF purge (PR / dry-run validation)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # cosign keyless via GitHub OIDC

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            v="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v=$(tr -d '[:space:]' < VERSION)
          fi
          if [[ ! "$v" =~ ^26\.04-[0-9]{8}(\.[0-9]+)?$ ]]; then
            echo "::error::version '$v' is not in the upstream form (e.g. 26.04-20261016)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$v"

  build:
    needs: resolve-version
    name: Build
    uses: open-img-cloud/.github/.github/workflows/build-libguestfs-image.yml@main
    with:
      os_name: ubuntu-26.04
      version: ${{ needs.resolve-version.outputs.version }}
      output_filename: 'ubuntu-26.04-{version}-x86_64.qcow2'
      upstream_url: 'https://cloud-images.ubuntu.com/releases/resolute/release-{version_suffix}/ubuntu-26.04-server-cloudimg-amd64.img'
      upstream_checksum_url: 'https://cloud-images.ubuntu.com/releases/resolute/release-{version_suffix}/SHA256SUMS'
      decompress: none
      customize_script: build/customize.sh
      run_sysprep: true
      sparsify_compress: true
      runtime_smoke_login_user: ubuntu
      publish: ${{ inputs.publish == true || github.event_name == 'push' }}
      sync_latest: true
    secrets: inherit
